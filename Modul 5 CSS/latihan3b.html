<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Animasi Transisi dan Keyframes CSS3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style type="text/css">
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .box {
            width: 40%;
            height: 100px;
            background: orange;
            border: 2px solid #212121;
            margin: 40px auto;

            -webkit-transition: all 1s ease-in-out;
            -o-transition: all 1s ease-in-out;
            -moz-transition: all 1s ease-in-out;
            transition: all 1s ease-in-out;
        }

        @keyframes putar {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @-webkit-keyframes putar {
            from {
                -webkit-transform: rotate(0deg);
            }
            to {
                -webkit-transform: rotate(360deg);
            }
        }

        @media (orientation: landscape) {
            .box {
                width: 250px;
                background: blue;
                border-radius: 50%;

                -webkit-animation: putar 2s linear infinite;
                animation: putar 2s linear infinite;
            }
        }
    </style>
</head>

<body>
    <h3>Transisi CSS3</h3>

    <div class="box"></div>
    <p>
        ubah orientasi ke landscape/portrait dan sebaliknya untuk melihat efek transisi
    </p>
</body>
</html>
