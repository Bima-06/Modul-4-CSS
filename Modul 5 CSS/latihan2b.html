<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Desain Responsif Flexbox</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style type="text/css">
        * {
            box-sizing: border-box;
        }

        #wrapper {
            margin: auto;
            width: 100%;
        }

        #header {
            height: 150px;
            padding: 20px;
            border: 2px solid red;
        }

        #nav {
            padding: 20px;
            border: 2px solid red;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        #nav h2 {
            width: 100%;
            margin: 0 0 10px 0;
        }

        .box {
            flex: 1 1 calc(25% - 15px);
            height: 120px;
            background: red;
            border: 2px solid red;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        #footer {
            padding: 20px;
            height: 120px;
            border: 2px solid red;
        }

        @media only screen and (max-width: 1080px) {
            .box {
                flex: 1 1 calc(50% - 10px);
            }
        }

        @media only screen and (max-width: 640px) {
            .box {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>

    <div id="wrapper">
        <div id="header">
            <h2>Header</h2>
        </div>

        <div id="nav">
            <h2>Services</h2>
            <div class="box"> BOX 1 </div>
            <div class="box"> BOX 2 </div>
            <div class="box"> BOX 3 </div>
            <div class="box"> BOX 4 </div>
        </div>

        <div id="footer">
            <h2>Footer</h2>
        </div>
    </div>

</body>
</html>
